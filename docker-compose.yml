services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admitwise
      POSTGRES_USER: admitwise
      POSTGRES_PASSWORD: admitwise
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/admitwise-change-me
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://admitwise:admitwise@postgres:5432/admitwise
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: admitwise-change-me
    ports: ["8000:8000"]
    depends_on: [postgres, neo4j]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  neo4j_data:

