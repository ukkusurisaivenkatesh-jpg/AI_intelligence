services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admitwise
      POSTGRES_USER: admitwise
      POSTGRES_PASSWORD: admitwise
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://admitwise:admitwise@postgres:5432/admitwise
    ports: ["8000:8000"]
    depends_on: [postgres]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:

